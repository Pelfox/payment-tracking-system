[project]
name = "payment-tracking-system"
version = "0.1.0"
description = "Tracking system for payments."
readme = "README.md"
authors = [
    { name = "Aleksey Demchenkov", email = "contact@pelfox.dev" }
]
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.13.5",
]

[project.scripts]
payment-tracking-system = "payment_tracking_system:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]
