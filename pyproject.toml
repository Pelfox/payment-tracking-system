[project]
name = "payment-tracking-system"
version = "0.1.0"
description = "Tracking system for payments."
readme = "README.md"
authors = [{ name = "Aleksey Demchenkov", email = "contact@pelfox.dev" }]
requires-python = ">=3.13"
dependencies = [
    "django>=6.1.3,<6.2",
    "pillow>=13.0.0,<14",
    "pydantic>=2.14.4",
    "unidecode>=1.4,<2",
]

[project.scripts]
payment-tracking-system = "payment_tracking_system:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "django-debug-toolbar>=8.0,<9",
    "flake8>=7.5.0",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
