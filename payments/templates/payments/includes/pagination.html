{% if page_obj %}
<nav aria-label="Страницы платежей" class="d-flex flex-wrap align-items-center gap-3 mt-3">
    {% if page_obj.has_previous %}
    <a class="btn btn-outline-secondary" href="{% querystring page=page_obj.previous_page_number %}">Назад</a>
    {% endif %}
    <span>Страница {{ page_obj.number }} из {{ page_obj.paginator.num_pages }}. Найдено: {{ page_obj.paginator.count }}.</span>
    {% if page_obj.has_next %}
    <a class="btn btn-outline-secondary" href="{% querystring page=page_obj.next_page_number %}">Далее</a>
    {% endif %}
</nav>
{% endif %}
